name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  lint:
    name: lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff format
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: Mypy
        run: mypy

  unit:
    name: unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest --cov --cov-report=term-missing

  # Real-stack lifecycle on rootless podman (create → healthy → db ops →
  # stop/start → remove). ubuntu runners ship podman; the compose provider is
  # docker-compose. Triggered manually/nightly so a slow image pull never
  # blocks a PR; the same suite runs locally via OII_INTEGRATION=1.
  integration:
    name: integration (rootless podman)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Show runtime versions
        run: |
          podman --version
          podman compose version --short || true
      - name: Integration tests
        env:
          OII_INTEGRATION: "1"
          OII_INTEGRATION_RUNTIME: podman
        run: pytest tests/integration -m integration -v
