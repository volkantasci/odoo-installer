[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "odoo-installer"
description = "Professional CLI to install, configure and manage Odoo 19.0 Docker stacks with OCA modules."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Volkan TASCI", email = "me@volkantasci.com" }]
keywords = ["odoo", "oca", "docker", "cli", "installer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Installation/Setup",
]
dynamic = ["version"]
dependencies = [
    "typer>=0.12",
    "rich>=13.9",
    "pydantic>=2.12",
    "httpx>=0.27",
    "jinja2>=3.1.6",
    "tomli-w>=1.0",
    "platformdirs>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "ruff>=0.8",
    "mypy>=1.14",
    "pre-commit>=4.0",
    "build>=1.2",
    "twine>=6.0",
]

[project.scripts]
odoo-installer = "odoo_installer.cli.main:app"
oii = "odoo_installer.cli.main:app"

[tool.hatch.version]
path = "src/odoo_installer/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/odoo_installer"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "DEVELOPMENT.md",
    "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["odoo_installer"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that require real git/docker; opt-in via OII_INTEGRATION=1",
]

[tool.coverage.run]
source = ["src/odoo_installer"]
branch = true
# docker/git/github/system adapters are thin subprocess/network wrappers with no
# unit-testable logic (core logic is tested through the fake adapters); they are
# exercised against the live stack instead. The filesystem adapter is pure local
# I/O and IS unit-tested (tests/unit/test_filesystem.py).
omit = [
    "src/odoo_installer/adapters/docker.py",
    "src/odoo_installer/adapters/git.py",
    "src/odoo_installer/adapters/github.py",
    "src/odoo_installer/adapters/system.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 85
